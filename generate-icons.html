<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>Icon Generator voor Voice Notes</h1>
    <p>Open deze pagina in een browser, klik met rechtermuisknop op de iconen en sla ze op.</p>

    <h2>192x192 Icon</h2>
    <canvas id="icon192" width="192" height="192"></canvas>

    <h2>512x512 Icon</h2>
    <canvas id="icon512" width="512" height="512"></canvas>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');

            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Microphone icon
            ctx.fillStyle = 'white';

            // Microphone body
            const centerX = size / 2;
            const centerY = size / 2;
            const micWidth = size * 0.15;
            const micHeight = size * 0.25;

            ctx.beginPath();
            ctx.roundRect(centerX - micWidth, centerY - micHeight, micWidth * 2, micHeight * 2, micWidth);
            ctx.fill();

            // Microphone stand
            ctx.beginPath();
            ctx.arc(centerX, centerY + micHeight, micWidth * 1.5, 0, Math.PI, true);
            ctx.stroke();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.03;
            ctx.stroke();

            // Base line
            ctx.beginPath();
            ctx.moveTo(centerX - micWidth * 1.5, centerY + micHeight + size * 0.08);
            ctx.lineTo(centerX + micWidth * 1.5, centerY + micHeight + size * 0.08);
            ctx.lineWidth = size * 0.03;
            ctx.stroke();

            // Center line
            ctx.beginPath();
            ctx.moveTo(centerX, centerY + micHeight);
            ctx.lineTo(centerX, centerY + micHeight + size * 0.08);
            ctx.lineWidth = size * 0.03;
            ctx.stroke();
        }

        drawIcon(document.getElementById('icon192'), 192);
        drawIcon(document.getElementById('icon512'), 512);

        // Auto-download
        setTimeout(() => {
            const canvas192 = document.getElementById('icon192');
            const canvas512 = document.getElementById('icon512');

            canvas192.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon-192.png';
                a.click();
            });

            canvas512.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon-512.png';
                a.click();
            });
        }, 1000);
    </script>
</body>
</html>
